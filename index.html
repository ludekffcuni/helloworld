<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }
    h1 {
      font-size: 3rem;
      margin: 0;
    }
    #clock {
      font-size: 1.25rem;
      margin-top: 0.5rem;
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <div id="clock"></div>
  </main>
  <script>
    const clock = document.getElementById("clock");
    function tick() {
      clock.textContent = new Date().toLocaleString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
